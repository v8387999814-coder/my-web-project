<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDENT ID CARD GENERATOR</title>
    <!-- html2canvas library jisse image download hogi -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 💡 FIX: Yeh box ab screen choti hone par bhi dono side ko strict aaju-baaju hi rakhega */
        .main-container {
            display: flex;
            flex-direction: row; 
            gap: 40px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 950px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Input Form Area */
        .input-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 280px;
        }
        .input-section h2 {
            margin: 0 0 10px 0;
            color: #333;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        .file-label {
            font-size: 13px;
            color: #555;
            font-weight: bold;
            margin-top: 5px;
        }
        
        /* Buttons Placement Layout */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            flex: 1;
            padding: 12px 20px;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }
        .get-btn {
            background-color: #1b7339;
        }
        .get-btn:hover {
            background-color: #115327;
        }
        .download-btn {
            background-color: #007bff;
        }
        .download-btn:hover {
            background-color: #0056b3;
        }

        /* Right Side ID Card Framework */
        .idcard-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .idcard {
            width: 450px;
            height: 270px;
            background-color: white;
            border: 2px solid #1b7339;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            flex-shrink: 0; /* Screen dabne par card ko chota nahi hone dega */
        }

        /* Card Header */
        .card-header {
            background-color: #1b7339;
            color: white;
            width: 100%;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .college-name {
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }
        .id-title {
            font-size: 10px;
            font-weight: bold;
            background: rgba(255,255,255,0.2);
            padding: 3px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }

        /* 💡 FIX: Isko column se badalkar ROW kiya taaki text aur photo side-by-side aayein */
        .card-body {
            flex: 1;
            display: flex;
            flex-direction: row; 
            padding: 15px;
            gap: 15px;
            align-items: center;
            box-sizing: border-box;
        }

        /* Left Side Student Data Column */
        .details-col {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .student-info {
            font-size: 13px;
            color: #333;
            margin: 0;
            display: flex;
        }
        .student-info strong {
            display: inline-block;
            width: 110px;
            color: #555;
            flex-shrink: 0; /* Target tags ko shrink hone se bachaega */
        }
        .student-info span {
            color: #111;
        }

        /* Right Side Passport Photo Slot */
        .photo-col {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .photo-box {
            width: 95px;
            height: 120px;
            border: 2px solid #1b7339;
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            color: #666;
            font-weight: bold;
            text-align: center;
            overflow: hidden;
            border-radius: 6px;
        }
        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        /* Card Footer */
        .card-footer {
            background-color: #115327;
            color: white;
            font-size: 12px;
            padding: 8px 12px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Responsiveness fix for very small viewport */
        @media (max-width: 820px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    
    <!-- LEFT SIDE: INPUT FORM -->
    <div class="input-section">
        <h2>Student Details</h2>
        <input type="text" id="stuName" placeholder="Student Name">
        <input type="text" id="stuRoll" placeholder="Roll Number">
        <input type="text" id="Father" placeholder="Father's Name">
        <input type="text" id="Mother" placeholder="Mother's Name">
        <input type="text" id="stuPhone" placeholder="Contact No">
        
        <span class="file-label">Upload Student Photo:</span>
        <input type="file" id="stuPhoto" accept="image/*" onchange="previewPhoto(event)">
        
        <div class="btn-group">
            <button class="get-btn" onclick="showDetails()">Generate ID Card</button>
            <button class="download-btn" onclick="downloadCard()">Download ID Card</button>
        </div>
    </div>

    <!-- RIGHT SIDE: LIVE ID CARD PREVIEW -->
    <div class="idcard-wrapper">
        <div class="idcard" id="myIdCard">
            <div class="card-header">
                <p class="college-name">Sri Balaji PG Mahavidhyala</p>
                <div class="id-title">STUDENT ID CARD</div>
            </div>

            <div class="card-body">
                <div class="details-col">
                    <p class="student-info"><strong>Name:</strong> <span id="outName">----</span></p>
                    <p class="student-info"><strong>Roll NO:</strong> <span id="outRoll">----</span></p>
                    <p class="student-info"><strong>Father Name:</strong> <span id="outFather">----</span></p>
                    <p class="student-info"><strong>Mother Name:</strong> <span id="outMother">----</span></p>
                    <p class="student-info"><strong>Contact Number:</strong> <span id="outcontact">----</span></p>
                </div>
                
                <div class="photo-col">
                    <div class="photo-box" id="pBox">
                        <span id="pText">PHOTO<br>BOX</span>
                        <img id="outPhoto" src="" alt="Student Photo">
                    </div>
                </div>
            </div>

            <div class="card-footer">
                Benar Road Jaipur 302012
            </div>
        </div>
    </div>

</div>

<!-- JAVASCRIPT: Logic Remains Unchanged -->
<script>
function showDetails() {
    document.getElementById("outName").innerText = document.getElementById("stuName").value || "----";
    document.getElementById("outRoll").innerText = document.getElementById("stuRoll").value || "----";
    document.getElementById("outFather").innerText = document.getElementById("Father").value || "----";
    document.getElementById("outMother").innerText = document.getElementById("Mother").value || "----";
    document.getElementById("outcontact").innerText = document.getElementById("stuPhone").value || "----";
}

function previewPhoto(event) {
    const reader = new FileReader();
    reader.onload = function() {
        const imgElement = document.getElementById("outPhoto");
        const textElement = document.getElementById("pText");
        
        imgElement.src = reader.result;
        imgElement.style.display = "block";
        textElement.style.display = "none";
    }
    reader.readAsDataURL(event.target.files[0]);
}

function downloadCard() {
    const card = document.getElementById("myIdCard");
    html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
        const link = document.createElement("a");
        link.download = (document.getElementById("stuName").value || "Student") + "_ID_Card.png";
        link.href = canvas.toDataURL();
        link.click();
    });
}
</script>

</body>
</html>
